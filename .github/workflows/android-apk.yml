name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          SDK_MANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)
          if [ -n "$SDK_MANAGER" ]; then "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: everyday-table-kitchen-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
